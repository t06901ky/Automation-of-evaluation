name: Weekly Report Generation

on:
  schedule:
    # 毎週土曜 09:00 JST (00:00 UTC)
    - cron: '0 0 * * 6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ダミーデータで実行 (true/false)'
        required: false
        default: 'false'

jobs:
  generate-weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Write service account credentials
        run: |
          mkdir -p credentials
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > credentials/service_account.json

      - name: Run coo-weekly skill
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_FILE: ./credentials/service_account.json
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TARGET_USER_EMAIL: ${{ secrets.TARGET_USER_EMAIL }}
          TARGET_USER_NAME: ${{ secrets.TARGET_USER_NAME }}
          TARGET_USER_GRADE: ${{ secrets.TARGET_USER_GRADE }}
          TARGET_CALENDAR_ID: ${{ secrets.TARGET_CALENDAR_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            claude --dangerously-skip-permissions -p "/coo-weekly --dry-run"
          else
            claude --dangerously-skip-permissions -p "/coo-weekly"
          fi

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_id }}
          path: output/
          retention-days: 90
