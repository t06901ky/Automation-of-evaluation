name: Weekly Report Reminder

on:
  schedule:
    # 毎週土曜 09:00 JST (00:00 UTC)
    - cron: '0 0 * * 6'
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Send Slack DM to kota.yamaguchi
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "channel": "U09BZPBMS02",
              "text": "📊 週次レポートの時間です！\n今週のKPIデータを入力して `/coo-weekly` を実行してください。\n\n例：「MRR 160万（北國銀行80・三森屋30・eeemo50）。週次資料作って」"
            }'
